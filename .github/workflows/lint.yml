name: lint

on:
  push:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev requirements
        run: pip install -r requirements-dev.txt

      - name: Run pylint
        run: pylint main.py core/ stratums/ utils/ scripts/
